services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: yoorker
      POSTGRES_PASSWORD: yoorker
      POSTGRES_DB: yoorker
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
