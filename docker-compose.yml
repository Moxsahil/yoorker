services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: yoorker
      POSTGRES_PASSWORD: yoorker
      POSTGRES_DB: yoorker
    ports: ["5432:5432"]
    healthcheck:
      # -h 127.0.0.1: the temporary server used during first-time init only listens on
      # the unix socket, so this check passes only once the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U yoorker -d yoorker"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
