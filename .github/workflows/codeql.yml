name: CodeQL

# Reads the source for security bugs (injection, unsafe redirects, request
# forgery, ReDoS) and reports them under Security → Code scanning.
# Free for a public repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1" # Mondays, so new upstream queries still check untouched code

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
