name: PR title

# The PR title becomes the squash commit on main, so it must be conventional.
# Only PRs into main: release PRs into production are titled "release: ...".
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            web
            dashboard
            api
            db
            contracts
            tokens
            ui
            config
            infra
            docs
            ci
            deps
            deps-dev
            repo
