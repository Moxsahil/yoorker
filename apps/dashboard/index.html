<!doctype html>
<html lang="en" class="antialiased font-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Yoorker owner dashboard." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10141c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/hanken-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Yoorker</title>
    <!-- Light or dark before the first paint, as next-themes will settle it ("theme" in localStorage, else the system). -->
    <script>
      try {
        var theme = localStorage.getItem("theme") || "system";
        var dark =
          theme === "dark" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
